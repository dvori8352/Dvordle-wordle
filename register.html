<!DOCTYPE html>
<html lang="en" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>הצטרפות</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 
   viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔮</text></svg>">
</head>
<link rel="stylesheet" href="login.css">
</head>

<body>
    <div>
        <div id="alllog">
            <div id="name">הרשמה</div>
            <div></div>
            <input type="text" placeholder=" בחר שם משתמש" id="run"> <br>
            <input type="password" placeholder=" בחר סיסמה " id="rup"><br><br>
            <button id="log">הרשמה</button>
        </div>
    </div>
</body>
<script>
    let users = JSON.parse(localStorage.getItem("alluser")) || [];

    let log = document.getElementById("log")
    log.addEventListener("click", function () {
        let na = document.getElementById("run")
        let pa = document.getElementById("rup")
        if (na.value != "" && pa.value != "" && users.find(user => user.name === na.value)
            === undefined && users.find(user => user.pass === pa.value) === undefined) {
            let newuser = {
                name: na.value,
                pass: pa.value,
                times: 0,
                lastday:undefined,
                amount:0
            }
            users.push(newuser)
            localStorage.setItem("alluser", JSON.stringify(users))
            window.location.href = "index.html";
        }
        else
            alert("אופס! השדות ריקים או ששם המשתמש כבר תפוס 🔮")
    })
    console.log(users)
</script>
<style>
    #name {
        background-image: linear-gradient(rgb(223, 102, 146), rgb(228, 62, 156), rgb(220, 145, 185));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        font-size: 120px;
        font-weight: bold;
        margin-bottom: 20px;
        margin-top: 50px;
    }

    #alllog {
        position: absolute;
        top: 18%;
        left: 33%;
        width: 500px;
        height: 500px;
        text-align: center;
    }

    input {
        margin: 10px;
        height: 80px;
        width: 450px;
        font-size: 35px;
        border-radius: 20px;
        color: rgb(235, 63, 183);
        text-shadow: 2px 2px 5px rgb(228, 62, 156);
    }

    body {
        background-color: rgb(239, 217, 242);
        background-image: url("תמונות/h.png");
        background-size: cover;
        background-position: center;
        margin: 0;
        height: 100vh;
    }

    button {
        width: 150px;
        height: 60px;
        background-color: rgb(246, 53, 156);
        color: white;
        border: 2px;
        border-style: double;
        border-radius: 10px;
        transition: 1s;
    }

    button:hover {
        width: 160px;
        height: 70px;
    }
</style>


</html>
